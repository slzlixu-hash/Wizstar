<!doctype html>
<html lang="zh-CN">

    <meta charset="utf-8" />

    <link rel="stylesheet" href="styles/tokens.css" />

  <body class="login-body">
    <div class="login-app">
      <!-- 自绘标题栏：左上品牌，右侧仅最小化 / 关闭 -->
      <header class="titlebar login-titlebar">
        <div class="titlebar-brand login-titlebar-brand">
          <span class="login-logo-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6.6 18.4 12 6l5.4 12.4" />
              <path d="M9.1 14.2h5.8" />
            </svg>
          </span>
          <span class="login-titlebar-name">AgentWorkBench</span>
        </div>
        <div class="window-controls login-window-controls">
          <button type="button" id="login-win-min" title="最小化" aria-label="最小化">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
              <path d="M5 12h14" />
            </svg>
          </button>
          <button type="button" id="login-win-close" title="关闭" aria-label="关闭">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
              <path d="m6 6 12 12M18 6 6 18" />
            </svg>
          </button>
        </div>
      </header>

      <div class="login-main">

                <radialGradient id="lg-halo" cx="50%" cy="50%" r="50%">
                  <stop offset="0%" stop-color="#22d3ee" stop-opacity=".2" />
                  <stop offset="48%" stop-color="#3b82f6" stop-opacity=".1" />
                  <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
                </radialGradient>
                <radialGradient id="lg-halo-strong" cx="50%" cy="50%" r="50%">
                  <stop offset="0%" stop-color="#67e8f9" stop-opacity=".24" />
                  <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
                </radialGradient>
                <linearGradient id="lg-plate-top" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#1d4ed8" stop-opacity=".42" />
                  <stop offset="100%" stop-color="#0b1c3c" stop-opacity=".8" />

                <linearGradient id="lg-plate-left" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#0f2347" />
                  <stop offset="100%" stop-color="#081226" />

                <linearGradient id="lg-plate-right" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#153366" />
                  <stop offset="100%" stop-color="#0a1830" />

                <linearGradient id="lg-hex-fill" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#0ea5e9" stop-opacity=".5" />
                  <stop offset="55%" stop-color="#2563eb" stop-opacity=".36" />
                  <stop offset="100%" stop-color="#1e1b4b" stop-opacity=".62" />
                </linearGradient>
                <linearGradient id="lg-beam" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#67e8f9" stop-opacity=".42" />
                  <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
                </linearGradient>
                <linearGradient id="lg-link" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0%" stop-color="#3b82f6" stop-opacity=".08" />
                  <stop offset="50%" stop-color="#22d3ee" stop-opacity=".5" />
                  <stop offset="100%" stop-color="#67e8f9" stop-opacity=".1" />
                </linearGradient>
                <pattern id="lg-grid" width="68" height="34" patternUnits="userSpaceOnUse">
                  <path d="M0 17 L34 0 L68 17 L34 34 Z" fill="none" stroke="rgba(96,165,250,.16)" stroke-width=".9" />
                </pattern>
                <linearGradient id="lg-grid-fade" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#fff" stop-opacity="0" />
                  <stop offset="35%" stop-color="#fff" stop-opacity=".5" />
                  <stop offset="100%" stop-color="#fff" stop-opacity="1" />
                </linearGradient>
                <mask id="lg-grid-mask">
                  <rect x="-200" y="170" width="1160" height="430" fill="url(#lg-grid-fade)" />
                </mask>
                <filter id="lg-blur" x="-50%" y="-50%" width="200%" height="200%">

                </filter>
                <filter id="lg-blur-sm" x="-60%" y="-60%" width="220%" height="220%">
                  <feGaussianBlur stdDeviation="2.4" />
                </filter>
                <filter id="lg-glow" x="-60%" y="-60%" width="220%" height="220%">
                  <feGaussianBlur stdDeviation="2.4" result="b" />
                  <feMerge>
                    <feMergeNode in="b" />
                    <feMergeNode in="SourceGraphic" />
                  </feMerge>
                </filter>
              </defs>

                <span class="login-card-badge" aria-hidden="true">

              <h2 class="login-welcome">欢迎登录</h2>

              <form class="login-form" id="login-form" novalidate>
                <div class="input-wrap login-field" id="login-field-user">

                <div class="input-wrap login-field" id="login-field-password">
                  <svg class="ic lead" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">

                  <input class="input login-input" id="login-password" name="password" type="password" placeholder="登录密码" autocomplete="current-password" spellcheck="false" />
                  <span class="trail">
                    <button type="button" class="login-eye" id="login-eye" title="显示密码" aria-label="显示密码">
                      <svg class="ic login-eye-open" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2.8 12S6 5.8 12 5.8 21.2 12 21.2 12 18 18.2 12 18.2 2.8 12 2.8 12Z" />
                        <circle cx="12" cy="12" r="2.9" />
                      </svg>
                      <svg class="ic login-eye-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 4.5 20 20" />
                        <path d="M9.8 5.9A9.6 9.6 0 0 1 12 5.8c6 0 9.2 6.2 9.2 6.2a17 17 0 0 1-3.1 3.9" />
                        <path d="M6.3 7.6A16.7 16.7 0 0 0 2.8 12S6 18.2 12 18.2a10 10 0 0 0 4.4-1" />
                        <path d="M10 10a2.9 2.9 0 0 0 4 4" />
                      </svg>
                    </button>
                  </span>
                </div>

                <label class="checkbox login-remember" id="login-remember">
                  <input type="checkbox" id="login-remember-input" />
                  <span class="box">
                    <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                      <path d="m5 12.5 4.2 4.2L19 6.8" />
                    </svg>
                  </span>
                  <span>记住账号和密码</span>
                </label>

                <button type="submit" class="login-submit" id="login-submit">
                  <span class="login-submit-label">立即登录</span>
                </button>
              </form>
            </div>

            <div class="login-meta">
              <span class="login-service">
                <i class="status-dot online"></i>
                <span>本地服务连接正常</span>
                <span class="mono login-endpoint" id="login-endpoint">(127.0.0.1:5210)</span>
              </span>
              <span class="login-version num" id="login-version">v1.9.0-MVP</span>
            </div>
          </div>
        </section>
      </div>
    </div>

    <script src="js/icons.js"></script>
    <script src="js/data.js"></script>
    <!-- 登录页不拉业务数据（/api/* 需登录令牌），因此不加载 api-client.js -->
    <script src="js/components.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
